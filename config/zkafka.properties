# Broker
broker.id=1
broker.host=localhost
broker.port=9092
storage.directory=data/broker-1

# ZooKeeper
zookeeper.connect=localhost:2181
zookeeper.session.timeout.ms=5000
zookeeper.connect.timeout.ms=10000

# Execution
broker.request.threads=10
broker.shutdown.timeout.ms=30000
client.connect.timeout.ms=5000
client.request.timeout.ms=5000
replication.request.timeout.ms=2000
controller.retry.delay.ms=2000

# Storage
storage.max.record.bytes=1048576
storage.max.segment.bytes=67108864
storage.flush.interval.ms=10000
storage.recovery.mode=tail-truncate

# Replication
replication.factor=3
replication.min.in.sync.replicas=2

# Network
network.max.frame.bytes=4194304
fetch.max.response.bytes=4194304
network.read.buffer.bytes=1024
network.accept.poll.interval.ms=100
network.read.poll.interval.ms=50

# Consumer
consumer.poll.interval.ms=
consumer.shutdown.timeout.ms=1000
